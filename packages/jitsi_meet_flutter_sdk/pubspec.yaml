name: jitsi_meet_flutter_sdk
description: Connect fork of jitsi_meet_flutter_sdk 13.1.1 — adds an embeddable conference view and native controls (camera flip, audio route).
publish_to: none
version: 13.1.1
homepage: https://jitsi.org/
repository: https://github.com/jitsi/jitsi-meet-flutter-sdk

environment:
  sdk: '>=3.0.5 <4.0.0'
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: org.jitsi.jitsi_meet_flutter_sdk
        pluginClass: JitsiMeetPlugin
      ios:
        pluginClass: JitsiMeetPlugin
